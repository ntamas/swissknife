[project]
name = "swissknife"
version = "1.0.0"
description = "A collection of handy utilities for data crunching"
authors = [{ name = "Tamas Nepusz", email = "ntamas@gmail.com" }]
license = "MIT"
requires-python = ">=3.10"
dependencies = ["numpy>=1.22.1"]
optional-dependencies = { plotting = ["matplotlib>=3.3.1"] }

[project.scripts]
aggregate = "swissknife.scripts.aggregate:main"
groupby = "swissknife.scripts.groupy:main"
qplot = "swissknife.scripts.qplot:main"
remap = "swissknife.scripts.remap:main"

[dependency-groups]
dev = ["swissknife[plotting]"]

[build-system]
requires = ["uv_build>=0.9"]
build-backend = "uv_build"
